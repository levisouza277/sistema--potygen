<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potygen Pro | Agenda Reprodutiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos padronizados da navbar -->
    <link rel="stylesheet" href="../style/navbar-style.css">
    
    <!-- Estilos específicos da página -->
    
</head>
<body>

<div class="app-container">
    <!-- ============================================ -->
    <!-- NAVBAR CARREGADA DINAMICAMENTE -->
    <!-- ============================================ -->
    
    <!-- ============================================ -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ============================================ -->
    
    <main class="main-content" id="mainContent">
        <header class="top-bar">
            <div class="top-bar-left">
                <div>
                    <h1 class="top-bar-title">Agenda Reprodutiva</h1>
                    <p class="top-bar-subtitle">Acompanhamento de fêmeas inseminadas</p>
                </div>
            </div>
        </header>

        <div class="filter-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="inputBuscaFemea" placeholder="Buscar fêmea por brinco ou nome...">
            </div>
            <div class="filter-actions">
                <button class="btn-filter" id="btnFiltrar"><i class="fa-solid fa-sliders"></i> Filtrar</button>
            </div>
        </div>

        <div class="content-card">
            <div class="table-container">
                <table class="animals-table">
                    <thead>
                        <tr>
                            <th>Brinco / ID</th>
                            <th>Nome da Matriz</th>
                            <th>Espécie / Raça</th>
                            <th>Última Inseminação</th>
                            <th>Reprodutor Macho</th>
                            <th>Lote / Localização</th>
                            <th style="text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaInseminadas">
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Scripts -->
<script>
    const cacheRegistros = [
        { id: 1, data_inseminacao: "2026-05-10", reprodutor_macho: "Bull Master", localizacao: "Piquete A", animais: { id: "1", brinco_id: "1002", nome: "Estrela", especie: "Bovino", raca: "Nelore" } },
        { id: 2, data_inseminacao: "2026-04-18", reprodutor_macho: "Teimoso Sêmen", localizacao: "Lote M", animais: { id: "2", brinco_id: "1054", nome: "Mimosa", especie: "Bovino", raca: "Gir" } },
        { id: 3, data_inseminacao: "2026-05-02", reprodutor_macho: "Ram Corajoso", localizacao: "Galpão Ovinos", animais: { id: "3", brinco_id: "2019", nome: "Luna", especie: "Ovino", raca: "Santa Inês" } }
    ];

    function renderizarTabela(lista) {
        const tbody = document.getElementById("tabelaInseminadas");
        if (!tbody) return;
        
        tbody.innerHTML = "";

        if (lista.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #94a3b8; padding: 40px;">Nenhum animal corresponde à pesquisa.</td></tr>`;
            return;
        }

        lista.forEach(reg => {
            const animal = reg.animais;
            const dataFormatada = new Date(reg.data_inseminacao).toLocaleDateString('pt-BR');

            tbody.innerHTML += `
                <tr>
                    <td><span style="font-weight: 700; color: #0d8a4f;">#${animal.brinco_id}</span></td>
                    <td><span style="font-weight: 600; color: #2b3674;">${animal.nome}</span></td>
                    <td>${animal.especie} <span style="color: #94a3b8; font-size:12px;">(${animal.raca})</span></td>
                    <td><i class="fa-solid fa-calendar-day" style="color: #94a3b8; margin-right: 5px;"></i>${dataFormatada}</td>
                    <td><i class="fa-solid fa-mars" style="color: #2f80ed; margin-right: 4px;"></i>${reg.reprodutor_macho}</td>
                    <td><span class="badge-lote">${reg.localizacao}</span></td>
                    <td style="text-align: center; vertical-align: middle;">
                        <a href="painel_animal.html?id=${animal.id}" class="btn-view-agenda">
                            <i class="fa-solid fa-calendar-week"></i> Ver Agendamentos
                        </a>
                    </td>
                </tr>
            `;
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        const inputBusca = document.getElementById("inputBuscaFemea");
        if (inputBusca) {
            inputBusca.addEventListener("input", (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (!query) {
                    renderizarTabela(cacheRegistros);
                    return;
                }
                const filtrados = cacheRegistros.filter(reg => {
                    return reg.animais.nome.toLowerCase().includes(query) || 
                           reg.animais.brinco_id.toLowerCase().includes(query);
                });
                renderizarTabela(filtrados);
            });
        }

        const btnFiltrar = document.getElementById("btnFiltrar");
        if (btnFiltrar) {
            btnFiltrar.addEventListener("click", () => {
                alert("Funcionalidade de filtros avançados em desenvolvimento");
            });
        }

        renderizarTabela(cacheRegistros);
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../backend/database.js"></script>
<script src="../backend/auth.js"></script>
<!-- Navbar Loading -->
<script src="../backend/navbar-loader.js"></script>
<!-- Navbar Script Global -->
<script src="../backend/navbar-script.js"></script>
<script src="../backend/logout.js"></script>

</body>
</html>
