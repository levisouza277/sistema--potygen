<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  POTYGEN — navbar.html  (Componente de Navegação Unificado)     ║
  ║                                                                  ║
  ║  COMO USAR:                                                      ║
  ║  Inclua o conteúdo deste arquivo dentro do <aside class="sidebar"> ║
  ║  de cada página. Para marcar o item ativo, adicione a classe     ║
  ║  "active" no link correspondente.                                ║
  ║                                                                  ║
  ║  DEPENDÊNCIAS:                                                   ║
  ║  - Font Awesome 6.4.0 (já incluído via CDN no projeto)          ║
  ║  - Fonte Inter (já incluída via Google Fonts no projeto)        ║
  ╚══════════════════════════════════════════════════════════════════╝
-->

<!--
  ┌─────────────────────────────────────────────────────────────────┐
  │  COLE ESTE BLOCO <aside> COMPLETO NAS SUAS PÁGINAS HTML         │
  └─────────────────────────────────────────────────────────────────┘
-->

<style>
  /* ================================================================
     POTYGEN NAVBAR — Estilos Unificados
     Inclua este bloco <style> uma vez no <head> da sua página,
     ou adicione ao seu arquivo CSS principal (style-dashboard.css).
     ================================================================ */

  :root {
    --nav-primary-green: #00b34e;
    --nav-dark-blue: #002144;
    --nav-text-navy: #2b3674;
    --nav-text-gray: #a3aed0;
    --nav-bg-light: #f4f7fe;
    --nav-white: #ffffff;
    --nav-border: #e9edf7;
    --nav-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.08);
    --nav-sidebar-width: 290px;
    --nav-transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Botão Hambúrguer — fixo, visível sempre */
  .nav-menu-toggle {
    position: fixed;
    top: 22px;
    left: 20px;
    width: 46px;
    height: 46px;
    background: var(--nav-white);
    border: 1px solid var(--nav-border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--nav-text-navy);
    cursor: pointer;
    box-shadow: var(--nav-shadow);
    z-index: 1002;
    transition: all var(--nav-transition);
  }
  .nav-menu-toggle:hover {
    background: var(--nav-bg-light);
    color: var(--nav-primary-green);
    transform: scale(1.05);
  }

  /* Overlay (mobile) */
  .nav-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 33, 68, 0.4);
    z-index: 1000;
  }
  .nav-overlay.visible { display: block; }

  /* Sidebar */
  .potygen-sidebar {
    width: var(--nav-sidebar-width);
    background: var(--nav-white);
    border-right: 1px solid var(--nav-border);
    display: flex;
    flex-direction: column;
    padding: 40px 25px;
    flex-shrink: 0;
    position: fixed;
    top: 0;
    left: calc(-1 * var(--nav-sidebar-width));
    height: 100vh;
    transition: left var(--nav-transition);
    z-index: 1001;
    overflow-y: auto;
  }
  .potygen-sidebar.nav-open { left: 0; }

  /* Logo */
  .potygen-sidebar .nav-logo-wrap {
    margin-bottom: 50px;
    padding-left: 50px; /* evita colisão com o botão hambúrguer */
  }
  .potygen-sidebar .nav-logo {
    width: 140px;
    object-fit: contain;
  }

  /* Links de Navegação */
  .potygen-nav { flex: 1; }
  .potygen-nav .nav-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 16px;
    text-decoration: none;
    color: var(--nav-text-gray);
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 15px;
    border-radius: 12px;
    margin-bottom: 5px;
    transition: color var(--nav-transition), background var(--nav-transition);
  }
  .potygen-nav .nav-item i {
    font-size: 17px;
    width: 20px;
    text-align: center;
  }
  .potygen-nav .nav-item:hover {
    color: var(--nav-primary-green);
    background: #f8fafc;
  }
  /* Estado ativo — barra verde à direita + texto escuro */
  .potygen-nav .nav-item.active {
    color: var(--nav-text-navy);
    font-weight: 700;
    border-right: 4px solid var(--nav-primary-green);
    border-radius: 12px 0 0 12px;
    background: transparent;
  }

  /* Rodapé da Sidebar */
  .potygen-sidebar-footer { margin-top: auto; }

  /* Card "Powered by IA" */
  .nav-ia-card {
    background: var(--nav-bg-light);
    padding: 15px;
    border-radius: 16px;
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
  }
  .nav-ia-card .nav-ia-icon {
    color: #3b82f6;
    font-size: 20px;
  }
  .nav-ia-card .nav-ia-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--nav-text-navy);
    font-family: 'Inter', sans-serif;
    display: block;
  }
  .nav-ia-card .nav-ia-sub {
    font-size: 11px;
    color: var(--nav-text-gray);
    font-family: 'Inter', sans-serif;
    display: block;
  }

  /* Botão Sair — design do gestao-animais.html */
  .nav-logout-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: #e53e3e;            /* vermelho vivo, exatamente como em gestao-animais */
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: none;
    border: none;
    cursor: pointer;
    width: 100%;
    text-align: left;
    transition: background var(--nav-transition), color var(--nav-transition);
  }
  .nav-logout-btn i {
    font-size: 16px;
  }
  .nav-logout-btn:hover {
    background: #fff5f5;
    color: #c53030;
  }

  /* ── Empurra o conteúdo principal quando sidebar está aberta (desktop) ── */
  @media (min-width: 1025px) {
    .main-content.nav-sidebar-open {
      padding-left: var(--nav-sidebar-width);
    }
    .main-content.nav-sidebar-open .top-bar {
      padding-left: 40px;
    }
  }
</style>

<!-- Botão Hambúrguer (fixo, fora do aside) -->
<button class="nav-menu-toggle" id="navToggleBtn" aria-label="Alternar menu lateral">
  <i class="fa-solid fa-bars"></i>
</button>

<!-- Overlay para mobile -->
<div class="nav-overlay" id="navOverlay"></div>

<!-- Sidebar Unificada -->
<aside class="potygen-sidebar" id="potygen-sidebar">

  <!-- Logo -->
  <div class="nav-logo-wrap">
    <img
      src="logo.png"
      alt="Potygen"
      class="nav-logo"
      onerror="this.onerror=null;this.src='https://placehold.co/140x48/ffffff/00b34e?text=Potygen';"
    >
  </div>

  <!-- Navegação principal -->
  <nav class="potygen-nav">
    <a href="dashboard.html"      class="nav-item" data-page="dashboard">
      <i class="fa-solid fa-house"></i>
      <span>Dashboard</span>
    </a>
    <a href="gestao-animais.html" class="nav-item" data-page="gestao-animais">
      <i class="fa-solid fa-cow"></i>
      <span>Gestão de Animais</span>
    </a>
    <a href="analise-genetica.html"class="nav-item" data-page="analise-genetica">
      <i class="fa-solid fa-dna"></i>
      <span>Análise Genética</span>
    </a>
    <a href="relatorio.html"      class="nav-item" data-page="relatorios">
      <i class="fa-solid fa-clipboard-list"></i>
      <span>Relatórios</span>
    </a>
    <a href="#"                   class="nav-item" data-page="configuracoes">
      <i class="fa-solid fa-gear"></i>
      <span>Configurações</span>
    </a>
  </nav>

  <!-- Rodapé: card IA + botão sair -->
  <div class="potygen-sidebar-footer">
    <div class="nav-ia-card">
      <span class="nav-ia-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></span>
      <div>
        <span class="nav-ia-title">Powered by IA</span>
        <span class="nav-ia-sub">Análise preditiva ativa</span>
      </div>
    </div>

    <button class="nav-logout-btn" id="navLogoutBtn" onclick="window.location.href='index.html'">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span>Sair da conta</span>
    </button>
  </div>

</aside>

<script>
  /* ================================================================
     POTYGEN NAVBAR — Script de Controle
     Cole este bloco <script> antes do </body> da sua página,
     ou adicione ao seu arquivo JS principal.
     ================================================================ */
  (function () {
    const toggleBtn  = document.getElementById('navToggleBtn');
    const sidebar    = document.getElementById('potygen-sidebar');
    const overlay    = document.getElementById('navOverlay');
    const mainContent = document.querySelector('.main-content');

    // Marca o item ativo com base na URL atual
    const currentFile = window.location.pathname.split('/').pop() || 'dashboard.html';
    const pageMap = {
      'dashboard.html':       'dashboard',
      'gestao-animais.html':  'gestao-animais',
      'relatorio.html':       'relatorios',
      'analise-genetica.html':'analise-genetica',
      'configuracoes.html':   'configuracoes',
    };
    const activePage = pageMap[currentFile];
    if (activePage) {
      const link = sidebar.querySelector(`[data-page="${activePage}"]`);
      if (link) link.classList.add('active');
    }

    // Toggle abrir/fechar
    function openSidebar() {
      sidebar.classList.add('nav-open');
      overlay.classList.add('visible');
      if (mainContent && window.innerWidth > 1024) {
        mainContent.classList.add('nav-sidebar-open');
      }
    }
    function closeSidebar() {
      sidebar.classList.remove('nav-open');
      overlay.classList.remove('visible');
      if (mainContent) mainContent.classList.remove('nav-sidebar-open');
    }
    function toggleSidebar() {
      sidebar.classList.contains('nav-open') ? closeSidebar() : openSidebar();
    }

    toggleBtn.addEventListener('click', toggleSidebar);
    overlay.addEventListener('click', closeSidebar);

    // Expõe para uso global (relatorio.html usa toggleSidebar() inline)
    window.toggleSidebar = toggleSidebar;
  })();
</script>
